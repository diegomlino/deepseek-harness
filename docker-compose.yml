version: '3.8'

services:
  deepseek-harness:
    image: node:22-slim
    container_name: deepseek-harness
    working_dir: /app
    command: sh -c "npm install -g pnpm @deepseek-ai/dsh && dsh web --host 127.0.0.1 --port 3080 --no-open"
    environment:
      - DSH_TRUSTED_HOSTS=*
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "3080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - deepseek-harness
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge