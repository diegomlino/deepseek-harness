services:
  deepseek-harness:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      TZ: America/Sao_Paulo

      DSH_HOME: /data/dsh

      # Definidos no Environment do Dokploy
      DSH_AUTH_USER: "${DSH_AUTH_USER}"
      DSH_AUTH_PASSWORD: "${DSH_AUTH_PASSWORD}"

    expose:
      - "7860"

    volumes:
      - harness-data:/data/dsh
      - harness-workspace:/workspace

    networks:
      - dokploy-network
      - default

volumes:
  harness-data:
  harness-workspace:

networks:
  dokploy-network:
    external: true