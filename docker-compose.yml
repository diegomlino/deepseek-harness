services:
  deepseek-harness:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      TZ: America/Sao_Paulo
      DSH_HOME: /data/dsh
      PORT: "7860"

      # Autoriza o domínio público usado pelo navegador
      DSH_TRUSTED_HOSTS: "deepseek.iaengenharia.ia.br"

    expose:
      - "7860"

    volumes:
      - harness-data:/data/dsh
      - harness-workspace:/workspace

    networks:
      - dokploy-network
      - default

volumes:
  harness-data:
  harness-workspace:

networks:
  dokploy-network:
    external: true