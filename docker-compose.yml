services:
  deepseek-harness:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      TZ: America/Sao_Paulo
      DSH_HOME: /data/dsh

      GATEWAY_AUTH_USER: "${GATEWAY_AUTH_USER}"
      GATEWAY_AUTH_PASSWORD: "${GATEWAY_AUTH_PASSWORD}"

    expose:
      - "7860"

    ports:
      - "127.0.0.1:7860:7860"

    volumes:
      - harness-data:/data/dsh
      - harness-workspace:/workspace

    networks:
      - dokploy-network
      - default

volumes:
  harness-data:
  harness-workspace:

networks:
  dokploy-network:
    external: true